---

{% assign id  = page.id | remove: '/' %}
{% assign map = site.data.maps | where: 'id', id | first %}

{% if site.env.DEBUG_MODE == 'true' %}
<b>[DEBUG INFO] (Development Mode Only)</b><br>
<b>ID:</b>  {{ id }} <small>(</small><code>{{ page.path }}</code><small>)</small><br>
<b>Map:</b> {{ map }}
{% endif %}

<!DOCTYPE html>
<html lang="ja">
  <head>
    {% include head.html %}

    <style>
      body,
      html {
        width:  100%;
        height: 100%;
        margin:    0;
        padding:   0;
      }

      .geolonia {
        width:  100%;
        height: 100%;
      }
      #custom-marker {
	width:   50px;
	height:  50px;
	cursor:  pointer;
	display: none;
      }
      #custom-marker img {
	max-width: 100%;
	height:    auto;
      }

      /* ポップアップ: 記事（青）とラジオ（赤・サムネイル付き）を見た目で分ける */
      .lm-label {
        display: inline-block;
        margin-bottom: 4px;
        padding: 1px 6px;
        border-radius: 3px;
        color: #fff;
        font-size: 11px;
        font-weight: bold;
      }
      .lm-label-article { background: #2d69b0; }
      .lm-label-radio   { background: #c4302b; }
      .lm-article {
        padding-left: 8px;
        border-left: 4px solid #2d69b0;
      }
      .lm-radio {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        padding: 6px 6px 6px 8px;
        border-left: 4px solid #c4302b;
        border-radius: 0 4px 4px 0;
        background: #fdf0ef;
        color: #333;
        text-decoration: none;
      }
      .lm-radio:hover { background: #f9dcda; }
      .lm-thumb {
        position: relative;
        flex: 0 0 96px;
        line-height: 0;
      }
      .lm-thumb img {
        width: 96px;
        border-radius: 3px;
      }
      .lm-play {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28px;
        height: 20px;
        border-radius: 5px;
        background: rgba(196, 48, 43, 0.9);
        color: #fff;
        font-size: 11px;
        line-height: 20px;
        text-align: center;
      }
      .lm-radio-body {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-size: 11px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div
      class="geolonia"
      data-lat="{{  map['lat'] }}"
      data-lng="{{  map['lng'] }}"
      data-zoom="{{ map['zoom'] }}"
      data-marker="off"
      data-custom-marker="#custom-marker"
      data-custom-marker-offset="0, 0"
      data-geojson="./public/{{ map['id'] }}.min.geojson"
      data-geolocate-control="on"
      data-cluster="on"
      data-cluster-color="rgba(237, 208, 70, 0.8)"
    ></div>

    <script
      type="text/javascript"
      {% if site.env.GEOLONIA_API_KEY %}
      src="https://cdn.geolonia.com/v1/embed?geolonia-api-key={{ site.env.GEOLONIA_API_KEY }}"
      {% else %}
      src="https://cdn.geolonia.com/v1/embed?geolonia-api-key=YOUR-API-KEY"
      {% endif %}
    ></script>

    {% include analytics.html %}
  </body>
</html>
