name: Build & Test
on:
  push:
    branches: ["main"]

  # Dependabot の PR を自動でマージする時、マージの前にビルドとテストが通るのを待てるようにする
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN は checkout にしか使わないので、読み取りだけにする
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Download codes from GitHub
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 2

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@v1.335.0
      with:
        bundler-cache: true

    - name: 🧪 Install gems
      run: |
        bundle install --jobs 4 --retry 3

    - name: 🔧 Build
      run: |
        JEKYLL_ENV=production bundle exec jekyll build

    - name: 🔍 Test
      run: |
        SKIP_BUILD=true bundle exec rake test

    - name: 🧪 Test scripts
      run: |
        bundle exec rake test_scripts
